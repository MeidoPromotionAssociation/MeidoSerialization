name: Auto Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binaries
        env:
          CGO_ENABLED: 0 
          GOARCH: amd64
        run: |
          mkdir -p dist
          GOOS=linux go build -trimpath -ldflags="-s -w" -o dist/MeidoSerialization-linux-amd64 .
          GOOS=windows go build -trimpath -ldflags="-s -w" -o dist/MeidoSerialization-amd64.exe .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64          
          path: dist/MeidoSerialization-linux-amd64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/MeidoSerialization-amd64.exe
