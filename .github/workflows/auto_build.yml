name: Auto Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binaries
        env:
          CGO_ENABLED: 0 
          GOARCH: amd64
        run: |
          mkdir -p dist
          VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          COMMIT="${GITHUB_SHA:0:8}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X github.com/MeidoPromotionAssociation/MeidoSerialization/cmd.buildVersion=${VERSION} -X github.com/MeidoPromotionAssociation/MeidoSerialization/cmd.buildCommit=${COMMIT} -X github.com/MeidoPromotionAssociation/MeidoSerialization/cmd.buildDate=${BUILD_DATE}"
          GOOS=linux go build -trimpath -ldflags="${LDFLAGS}" -o dist/MeidoSerialization_linux_amd64 .
          GOOS=windows go build -trimpath -ldflags="${LDFLAGS}" -o dist/MeidoSerialization.exe .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64          
          path: dist/MeidoSerialization_linux_amd64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/MeidoSerialization.exe
